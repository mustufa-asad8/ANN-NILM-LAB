services:
  nilm-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nilm-ann-dashboard
    ports:
      - "8501:8501"
    volumes:
      - type: bind
        source: ./artifacts
        target: /app/artifacts
      - type: bind
        source: ./data/raw
        target: /app/data/raw
        read_only: true
    restart: unless-stopped
