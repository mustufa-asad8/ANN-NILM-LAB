services:
  nilm-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nilm-ann-dashboard
    ports:
      - "8501:8501"
    volumes:
      - type: bind
        source: ./outputs
        target: /app/outputs
      - type: bind
        source: ./1minute_data_austin
        target: /app/1minute_data_austin
        read_only: true
      - type: bind
        source: ./1minute_data_california
        target: /app/1minute_data_california
        read_only: true
      - type: bind
        source: ./1minute_data_newyork
        target: /app/1minute_data_newyork
        read_only: true
    restart: unless-stopped
